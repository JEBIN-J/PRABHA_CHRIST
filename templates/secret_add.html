{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2 style="text-align: center; margin-bottom: 2rem;">Add New Artwork</h2>
        <form action="{{ url_for('secret_add') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Artwork Title</label>
                <input type="text" id="title" name="title" required placeholder="Enter title...">
            </div>

            <div class="form-group">
                <label for="category_id">Category</label>
                <select id="category_id" name="category_id" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="file">Artwork Image</label>
                <input type="file" id="file" name="file" accept="image/*" required>
            </div>

            <button type="submit" class="btn-submit">Publish Artwork</button>
        </form>
    </div>
</div>
{% endblock %}
